name: Release

# Publishes a GitHub release named "CUI 1.2" whose notes are that version's section of
# CHANGELOG.md. Either push a tag like v1.2.0, or run this workflow by hand with the
# version and the commit to release (it creates the tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 1.2.0'
        required: true
      ref:
        description: 'Commit or branch to release'
        required: true
        default: master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - name: Version and notes from the changelog
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then tag="v${{ inputs.version }}"; else tag="${GITHUB_REF_NAME}"; fi
          ver="${tag#v}"; short="${ver%.*}"
          awk -v v="· ${short}" 'index($0, "## ") == 1 { if (on) exit; if (index($0, v)) { on = 1; next } } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No section for ${short} in CHANGELOG.md"; exit 1; fi
          echo "tag=${tag}" >> "$GITHUB_ENV"
          echo "title=CUI ${short}" >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Single-file distribution
        run: |
          # older commits predate it: release without the files then
          if [ -f tools/amalgamate.py ]; then python3 tools/amalgamate.py dist; else mkdir -p dist; fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${tag}" --target "${sha}" --title "${title}" --notes-file notes.md $(ls dist/cui.h dist/cui.c dist/cui_single.h 2>/dev/null)
